name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Python 3.14 for `compression.zstd`. The session transcripts are multi-frame
      # zstd, so the fidelity and replay checks cannot decode them on an older Python —
      # and silently skipping those checks is exactly the false green this repo has
      # already been burned by once.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # lib/index.js imports the harness's @deepseek-ai/* peers, which only the
      # harness supplies at runtime. On a clean runner there is no harness, so
      # stub the three peers the plugin actually touches.
      #
      # What this does and does not prove: the suites below exercise the
      # plugin's own logic (matcher, seam wiring, message-batch assembly). They
      # do NOT prove the peers behave like the real harness — for that, run
      # tools/verify_elevation_plugin.py against an actual install, which is a
      # local step because it needs a licensed DeepSeek Harness install.
      - name: Stub harness peers
        shell: bash
        run: node tools/stub-peers.mjs

      # The history replay reads ~/.dsh/sessions, which does not exist on a clean
      # runner, so it prints a skip and the curated cases + policy guards still run.
      # The replay is a local step by design: `python tools/verify_elevation_plugin.py`
      # on a machine with a session store is what exercises it.
      - name: decide (matcher + curated cases + policy guards)
        run: node test/decide.test.mjs

      - name: regressions (the plugin's promises about itself)
        run: node test/regressions.mjs

      # Proves the fidelity classifier points the right way on fixtures. The real
      # measurement needs ~/.dsh/sessions, which a clean runner does not have, so this
      # runs the self-check only and does not claim a pass rate.
      # Windows runners default stdout to cp1252, so printing CJK exits 1 AFTER the
      # assertions passed. This runs every Python entry point under cp1252 and fails
      # on the encode error, which is the bug that turned Windows CI red while Linux
      # stayed green.
      - name: python stdout encoding (cp1252)
        run: node test/encoding.mjs

      - name: elevation fidelity (classifier self-check)
        run: python test/_elevation_fidelity.py --self-check

      # Proves the new-era branch end to end: plants synthetic post-R13 transcripts in
      # the harness's on-disk shape, scans them, and asserts the artifact rate and the
      # hard-fail verdict. CI-safe: writes only under .tmp/, never the session store.
      - name: elevation fidelity (new-era scoring on synthetic corpus)
        run: node test/fidelity.corpus.mjs

      - name: apply (seam wiring)
        run: node test/apply.test.mjs

      - name: e2e (message batch)
        run: node test/e2e.mjs

      # The restart check's live layer attaches to a running Host over CDP, which a
      # clean runner does not have. Its verdict function is fixture-proven here
      # instead, so a broken judge fails CI rather than only showing up on a desktop.
      - name: live probe (verdict self-check)
        run: node tools/live_probe.mjs --self-check

  lint-manifest:
    name: package manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate package.json
        run: |
          node -e "
            const p = require('./package.json');
            const required = ['name','version','description','license','repository','engines'];
            const missing = required.filter((k) => !p[k]);
            if (missing.length) { console.error('missing:', missing); process.exit(1); }
            if (p.private) { console.error('package.json is private'); process.exit(1); }
            if (!p.dsh?.bundle?.patch) { console.error('no dsh.bundle.patch'); process.exit(1); }
            if (!require('fs').existsSync(p.dsh.bundle.patch)) { console.error('bundle patch missing on disk'); process.exit(1); }
            console.log('manifest ok');
          "
